PACKAGE_NAME="appleibridge"
PACKAGE_VERSION="0.1"
CLEAN="make clean"
MAKE="make"
BUILT_MODULE_NAME[0]="apple-ibridge"
BUILT_MODULE_NAME[1]="apple-ib-tb"
BUILT_MODULE_NAME[2]="apple-ib-als"
# Arch DKMS 3.x installs here. systemd/touchbar-enable.sh looks in the same
# place first. Do not put these in the initramfs: loading at sysinit can hang
# the box with no login screen (see WORKING-RECIPE.md).
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"
AUTOINSTALL="yes"
REMAKE_INITRD="no"
