# T1 MacBook Pro has no physical Esc until the Touch Bar driver is up.
# Hold Fn, tap ` (left of 1) → Escape.
#
# fn+grave as a chord is simultaneous-press-within-50ms and still prints
# backtick. Make Fn a layer instead.
#
#   sudo pacman -S --needed keyd
#   sudo install -Dm644 scripts/keyd-apple-esc.conf /etc/keyd/apple-esc.conf
#   sudo keyd check /etc/keyd/apple-esc.conf
#   sudo systemctl enable --now keyd.service
#
# Restrict to one keyboard by replacing * with the id from `sudo keyd monitor`.
[ids]
*

[main]
fn = layer(fn)

[fn]
grave = esc
