# 15-inch T1 (MacBookPro13,3 / 14,3), drop-in for /etc/limine-entry-tool.d/. Run limine-update after.
#
# deep (S3) resumes, but the Radeon Pro does not reload its SMU firmware afterwards
# (amdgpu_device_ip_resume failed -22) and the compositor wedges in D state. In s2idle amdgpu
# skips the pre-sleep PCI config reset and, with d3cold forbidden (udev rule), the GPU stays
# powered in D3hot with the SMU still running.
KERNEL_CMDLINE[default]+=" mem_sleep_default=s2idle"
#
# In Darwin mode (the kernel declares _OSI("Darwin") on Macs) the ACPI _PS3 of the Thunderbolt
# bridges (PEG1, UPSB.DSB0, UPSB.DSB2) calls PCDA(), which drops the controller's power GPIOs;
# the matching _PS0 only clears a flag, the real power-up is done by macOS's driver (NHI0.TRPE).
# Linux runs those _PS3 when it puts the bridges in D3hot at suspend. pcie_port_pm=off forbids
# D3 for every PCIe bridge: _PS3 never runs, power never drops. pcie_ports=compat is NOT enough
# (the kernel treats Thunderbolt bridges as D3-capable regardless) and it also disables native
# hotplug.
KERNEL_CMDLINE[default]+=" pcie_port_pm=off"
